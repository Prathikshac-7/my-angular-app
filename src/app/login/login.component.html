<div class="login-container">
    <div class="login-card">
      <h2>Login</h2>
      <form class="auth-form" (submit)="onLogin()">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email" [(ngModel)]="loginObj.email" name="email" required>
  
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" [(ngModel)]="loginObj.password" name="password" required>
  
        <button type="submit">Login</button>
  
        <p class="signup-text">New User? <a routerLink="/signup">Sign up</a></p>
      </form>
    </div>
  </div>
